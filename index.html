<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>긴급 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://djecswoekpqiydrlriyd.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-NUgsUBSfLy6qyyYXvMlFA_EOqLZeya";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
</head>
<body style="padding: 30px; font-family: sans-serif; text-align: center;">
    <h2>🔧 기사 등록 긴급 테스트</h2>
    <p style="color: #666; font-size: 14px;">아래 버튼을 누르면 즉시 데이터베이스에 글이 등록됩니다.</p>
    
    <button onclick="testInsert()" style="padding: 20px 40px; font-size: 18px; font-weight: bold; background: #0f172a; color: white; border: none; border-radius: 12px; cursor: pointer;">
        🚀 지금 바로 강제 등록 테스트
    </button>

    <script>
        async function testInsert() {
            alert("1번: 버튼 클릭 감지됨!");
            
            const { error } = await supabase.from('posts').insert([{
                id: Date.now(),
                title: "테스트 기사 제목입니다",
                content: "이것은 강제 테스트 내용입니다.",
                author: "관리자",
                category: "ARTICLE",
                date: "2026-03-20"
            }]);
            
            if (error) {
                alert("❌ DB 저장 실패 에러: " + error.message);
            } else {
                alert("🎉 성공! 데이터베이스에 글이 정상적으로 박혔습니다!");
            }
        }
    </script>
</body>
</html>
