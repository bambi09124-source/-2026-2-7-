<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>에러 확인용 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://djecswoekpqiydrlriyd.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-NUgsUBSfLy6qyyYXvMlFA_EOqLZeya";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
</head>
<body style="padding: 30px; text-align: center; font-family: sans-serif;">
    <h2>🔍 에러 원인 확인용 버튼</h2>
    <button onclick="checkError()" style="padding: 20px; font-size: 16px; background: #000; color: #fff; border-radius: 10px; cursor: pointer;">
        에러 내용 확인하기
    </button>

    <script>
        async function checkError() {
            try {
                alert("통신 시작...");
                const { data, error } = await supabase.from('posts').insert([{
                    id: Date.now(),
                    title: "테스트",
                    content: "테스트",
                    author: "관리자",
                    category: "ARTICLE",
                    date: "2026-03-20"
                }]);
                
                if (error) {
                    alert("❌ Supabase 에러 발생: " + JSON.stringify(error));
                } else {
                    alert("🎉 대성공! 데이터가 잘 들어갔습니다!");
                }
            } catch (err) {
                alert("💥 코드 예외 발생: " + err.message);
            }
        }
    </script>
</body>
</html>
